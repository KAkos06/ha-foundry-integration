name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag against integration version
        shell: bash
        run: |
          manifest_version="$(jq -r '.version' custom_components/foundry_conversation/manifest.json)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
