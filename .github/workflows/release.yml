name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and validate release
        id: vars
        shell: bash
        run: |
          manifest_version="$(jq -r '.version' custom_components/foundry_conversation/manifest.json)"
          target_tag="v${manifest_version}"
          
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$manifest_version" != "$tag_version" ]]; then
              echo "Tag version $tag_version does not match manifest version $manifest_version" >&2
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse "${target_tag}" >/dev/null 2>&1; then
              echo "Tag ${target_tag} already exists, skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag_name=${target_tag}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish GitHub release
        if: steps.vars.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
        run: >-
          gh release create "$TAG_NAME"
          --generate-notes
          --title "$TAG_NAME"
          --target "$GITHUB_SHA"

